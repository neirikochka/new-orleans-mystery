<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Новый Орлеан — 1840</title>

  <link rel="stylesheet" href="style.css">
</head>

<body>

  <main class="city">

    <h1>Новый Орлеан</h1>

    <div class="year">1840</div>

    <p class="intro">
      Ночь опустилась на город слишком быстро.
      В окнах старых домов мерцают свечи,
      с Миссисипи тянет влажным воздухом,
      а где-то далеко играет музыка.
      Здесь есть места, о которых говорят все.
      И есть те, о которых лучше молчать.
    </p>

    <div class="districts">

      <button onclick="visit('Французский квартал')">
        Французский квартал
      </button>

      <button onclick="visit('Порт')">
        Порт
      </button>

      <button onclick="visit('Треме')">
        Треме
      </button>

      <button onclick="visit('Старое поместье')">
        Старое поместье
      </button>

      <button onclick="visit('Болота')">
        Болота
      </button>

      <button onclick="visit('Место, которого нет на карте')">
        Место, которого нет на карте
      </button>

    </div>

    <div id="message"></div>
    <div id="location"></div>
    <button id="backButton" onclick="backToCity()">
  Вернуться в город
</button>

  </main>


  <script>
    function visit(place) {

      document.getElementById("location").textContent = place;

      const messages = {

        "Французский квартал":
          "Музыка доносится из открытых окон, а среди старых домов кто-то наблюдает за тобой.",

        "Порт":
          "С Миссисипи тянет сыростью. Между кораблями мелькает чей-то силуэт.",

        "Треме":
          "Здесь вечер никогда не бывает совсем тихим. Но сегодня в переулках слишком мало людей.",

        "Старое поместье":
          "За высокими воротами горит всего одно окно. Кажется, тебя там уже ждали.",

        "Болота":
          "Туман становится гуще с каждым шагом. Где-то в камышах раздаётся плеск.",

        "Место, которого нет на карте":
          "Ты уверен, что этого переулка здесь раньше не было."
      };

      document.getElementById("message").textContent = messages[place];
    }
function backToCity() {
  document.getElementById("location").textContent = "";
  document.getElementById("message").textContent = "";
}
  </script>

</body>
</html>
