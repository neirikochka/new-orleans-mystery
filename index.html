<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Новый Орлеан — 1840</title>

  <style>
    body {
      margin: 0;
      min-height: 100vh;
      background: #171315;
      color: #e8dccd;
      font-family: Georgia, serif;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    .city {
      width: 90%;
      max-width: 700px;
      padding: 40px 25px;
      text-align: center;
    }

    h1 {
      font-size: 42px;
      margin-bottom: 8px;
      color: #c9a66b;
    }

    .year {
      color: #9d8b7d;
      font-size: 18px;
      margin-bottom: 35px;
    }

    .intro {
      font-size: 19px;
      line-height: 1.7;
      margin-bottom: 35px;
    }

    .districts {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    button {
      background: #241c1e;
      color: #e8dccd;
      border: 1px solid #594449;
      padding: 16px;
      font-size: 17px;
      font-family: Georgia, serif;
      cursor: pointer;
    }

    button:hover {
      background: #302326;
      border-color: #a77b54;
    }

    #message {
      margin-top: 30px;
      min-height: 50px;
      color: #c9a66b;
      font-style: italic;
      line-height: 1.6;
    }
  </style>
</head>

<body>

  <main class="city">
    <h1>Новый Орлеан</h1>

    <div class="year">1840 год</div>

    <p class="intro">
      Ночь опустилась на город слишком быстро.
      В окнах старых домов мерцают свечи,
      с Миссисипи тянет влажным воздухом,
      а где-то далеко играет музыка.
      Здесь есть места, о которых говорят все.
      И есть те, о которых лучше молчать.
    </p>

    <div class="districts">
      <button onclick="visit('Французский квартал')">
        Французский квартал
      </button>

      <button onclick="visit('Порт')">
        Порт
      </button>

      <button onclick="visit('Треме')">
        Треме
      </button>

      <button onclick="visit('Старое поместье')">
        Старое поместье
      </button>

      <button onclick="visit('Болота')">
        Болота
      </button>

      <button onclick="visit('Неизвестное место')">
        Место, которого нет на карте
      </button>
    </div>

    <div id="message"></div>
  </main>

  <script>
    function visit(place) {
      document.getElementById("message").textContent =
        "Ты направляешься в: " + place + ". Что-то подсказывает, что сегодня город приготовил тебе сюрприз...";
    }
  </script>

</body>
</html>
